name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel older runs of the same ref when a new commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    # Same image tag as in compose.yaml
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webhook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d webhook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Variable names read by src/config/typeorm.ts (test-only values, not secrets)
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: webhook

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3 # keep in sync with the Dockerfile

      # Vitest and the Nest CLI run on Node
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run test
      - run: bun run test:e2e
